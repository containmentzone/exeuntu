name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Reads @containmentzone/pi-web-cyac from GitHub Packages. The
          # job's own token works once the package grants this repository
          # read access; a PACKAGES_TOKEN secret (read:packages) overrides it.
          secrets: |
            npm_token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
